[package]
name = "mcumgr-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mcumgr"
crate-type = ["staticlib", "rlib"]

[dependencies]
mcumgr-client = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
serialport = { version = "4.2", default-features = false }

[profile.release]
panic = "unwind"

